

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | NoticeMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand-panel">
            <div class="brand-logo">N</div>
            <h1>NoticeMate</h1>
            <h2>Your college life,<br>more organised.</h2>
            <p>Never miss an assignment, examination, event or scholarship update.</p>
        </div>

        <div class="auth-form-panel">
            <div class="auth-form">

                <p class="auth-small-heading">GET STARTED</p>
                <h2>Create your account</h2>
                <p class="auth-description">
                    Join NoticeMate and keep track of every important update.
                </p>

                <form method="POST">

                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                    <button type="submit" class="auth-button">
                        Create Account
                    </button>

                </form>

                <p class="auth-switch">
                    Already have an account?
                    <a href="/login">Login</a>
                </p>

            </div>
        </div>

    </div>

</body>
</html>
