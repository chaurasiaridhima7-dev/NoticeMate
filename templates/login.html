
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NoticeMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand-panel">
            <div class="brand-logo">N</div>
            <h1>NoticeMate</h1>
            <h2>Stay informed.<br>Stay organised.</h2>
            <p>Your college notices, deadlines and reminders — all in one place.</p>
        </div>

        <div class="auth-form-panel">
            <div class="auth-form">

                <p class="auth-small-heading">WELCOME BACK</p>
                <h2>Login to your account</h2>
                <p class="auth-description">
                    Enter your details to access your student dashboard.
                </p>

                <form method="POST">

                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit" class="auth-button">
                        Login
                    </button>

                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="/signup">Create an account</a>
                </p>

            </div>
        </div>

    </div>

</body>
</html>
